<style>
:root{--bg:#f4f5f7;--fg:#111827;--muted:#6b7280;--card:#fff;--accent:#1f2937;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--fg:#f3f4f6;--muted:#9ca3af;--card:#1a1f29;--accent:#e5e7eb}}
:root[data-theme="dark"]{--bg:#0f1218;--fg:#f3f4f6;--muted:#9ca3af;--card:#1a1f29;--accent:#e5e7eb}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
main{max-width:920px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;margin:0 0 12px}
p{color:var(--muted);margin:0 0 24px;line-height:1.6}
button.cta{background:var(--accent);color:var(--bg);border:0;border-radius:999px;padding:12px 26px;font-size:1rem;cursor:pointer;font-family:inherit}
.thumb{background:var(--card);border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);cursor:zoom-in;border:0;transition:transform .2s}
.thumb:hover{transform:translateY(-4px)}
.thumb img{width:100%;display:block;border-radius:8px}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;overflow:auto;padding:24px;z-index:10;cursor:zoom-out}
#viewer.open{display:block}
#viewer img{display:block;max-width:100%;width:760px;margin:0 auto;border-radius:6px}
#close{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;background:#fff;color:#000;border:0;border-radius:50%;width:40px;height:40px;font-size:22px;cursor:pointer}
@media(max-width:700px){main{grid-template-columns:1fr;gap:24px;text-align:center}}
</style>
